<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP source (1200x630) — 画像生成用。公開ページではありません</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #fff;
    background:
      radial-gradient(1400px 420px at 50% -120px, rgba(255,255,255,0.20), transparent 70%),
      linear-gradient(135deg, #063d23 0%, #0a7a41 55%, #12a555 100%);
    position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.055) 0 64px, rgba(255,255,255,0) 64px 128px);
  }
  .wrap { position: relative; text-align: center; padding: 0 72px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 24px; font-weight: 800; letter-spacing: 0.18em;
    padding: 11px 28px; border-radius: 999px;
    background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.32);
  }
  h1 {
    margin: 34px 0 0;
    font-size: 76px; font-weight: 900; line-height: 1.28; letter-spacing: 0.005em;
    text-shadow: 0 3px 18px rgba(0,0,0,0.18);
  }
  h1 .hl { color: #b8f5cf; }
  .sub {
    margin-top: 26px; font-size: 29px; font-weight: 500;
    color: rgba(255,255,255,0.90);
  }
  .foot {
    margin-top: 44px;
    display: inline-flex; align-items: center; gap: 20px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 11px;
    background: #06c755; color: #fff;
    font-size: 27px; font-weight: 800;
    padding: 16px 34px; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
  }
  .url { font-size: 23px; font-weight: 600; color: rgba(255,255,255,0.78); letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">⚽ JOBSAKA</span>
    <h1>新着のJリーグ求人を、<br><span class="hl">LINE</span>でまとめて受け取る</h1>
    <p class="sub">クラブの求人は、突然出て突然締まる。見逃さないための通知を月1回ほど。</p>
    <div class="foot">
      <span class="pill">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 5.6 2 10.1c0 4 3.6 7.4 8.4 8 .3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c-.1.3-.2 1.1 1 .6s6.3-3.7 8.6-6.4c1.6-1.7 2.2-3.5 2.2-4.6C23 5.6 18.5 2 12 2z"/></svg>
        登録は無料
      </span>
      <span class="url">jobsoccer.github.io</span>
    </div>
  </div>
</body>
</html>
